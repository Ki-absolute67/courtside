<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside NBA Stats</title>
<meta name="description" content="Live NBA scores, standings, league leaders and player stats.">
<meta name="theme-color" content="#1d1a17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Courtside">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky scoreboard-style header with tabs; one content column, max 1100px */
:root {
  --bg: #f3f1ee;
  --surface: #ffffff;
  --line: #e2ddd6;
  --fg: #1d1a17;
  --muted: #776f66;
  --accent: #d2561f;
  --accent-soft: #fbe6db;
  --win: #1f7a4a;
  --loss: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14120f; --surface: #1e1b18; --line: #34302b; --fg: #f1ece6;
    --muted: #a39a90; --accent: #f07a3f; --accent-soft: #3a2417;
    --win: #5fc28c; --loss: #f2786f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }

header { position: sticky; top: 0; z-index: 5; background: var(--fg); color: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.bar { max-width: 1100px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: end; gap: 8px 24px; }
.install { margin-left: auto; align-self: center; margin-bottom: 10px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font: 600 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.install:focus-visible { outline: 2px solid var(--bg); outline-offset: 2px; }
.offline { background: var(--accent-soft); color: var(--fg); text-align: center; font-size: 13px; padding: 6px 16px; }
.ios-tip { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: 0 8px 30px rgb(0 0 0 / .25); display: flex; gap: 12px; align-items: start; max-width: 420px; margin: 0 auto; }
.ios-tip p { margin: 0; flex: 1; }
.brand { font: 700 26px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; padding-bottom: 12px; }
.brand span { color: var(--accent); }
nav { display: flex; gap: 4px; overflow-x: auto; }
nav button { background: none; border: 0; padding: 10px 14px 12px; font: 600 16px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; opacity: .65; cursor: pointer; border-bottom: 3px solid transparent; }
nav button[aria-selected="true"] { opacity: 1; border-color: var(--accent); }
nav button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, .row-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
h2 { font: 700 28px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h3 { font: 600 18px/1.2 var(--display); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.toolbar h2 { margin-right: auto; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
input[type="date"], input[type="search"], select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.muted { color: var(--muted); }
.status { padding: 32px 0; color: var(--muted); }
.err { color: var(--loss); }

/* Scores */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.game-state { display: flex; justify-content: space-between; font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.live { color: var(--accent); }
.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.team-line { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; }
.team-line img { width: 28px; height: 28px; object-fit: contain; }
.team-name { font-weight: 600; }
.team-name small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.score { font: 700 26px/1 var(--display); }
.team-line.lost .score, .team-line.lost .team-name { color: var(--muted); }
.game-leaders { border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }

/* Tables */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
th.sortable { cursor: pointer; }
th.sorted { color: var(--accent); }
td:first-child, th:first-child, td.left, th.left { text-align: left; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--accent-soft); }
.rank { color: var(--muted); width: 32px; }
.who { display: flex; align-items: center; gap: 10px; }
.who img { width: 30px; height: 30px; object-fit: cover; border-radius: 50%; background: var(--bg); }
.who img.logo { border-radius: 0; object-fit: contain; background: none; width: 24px; height: 24px; }
.row-link { cursor: pointer; font-weight: 600; background: none; border: 0; padding: 0; text-align: left; }
.row-link:hover { color: var(--accent); }
.hl { font-weight: 700; color: var(--fg); }
.cutoff td { border-bottom: 2px dashed var(--muted); }
.w { color: var(--win); } .l { color: var(--loss); }
.conf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 20px; }
.legend { font-size: 13px; color: var(--muted); margin-top: 10px; }

/* Players */
.search-box { position: relative; flex: 1 1 280px; max-width: 420px; }
.search-box input { width: 100%; }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; z-index: 4; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
.suggest button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 8px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.suggest button:hover, .suggest button.active { background: var(--accent-soft); }
.suggest img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--bg); }
.profile { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
.profile img { width: 120px; height: 88px; object-fit: cover; object-position: top; }
.profile h2 { font-size: 36px; }
.jersey { font: 700 36px/1 var(--display); color: var(--accent); margin-right: 8px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 8px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--fg); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.tile .v { font: 700 32px/1 var(--display); }
.tile .k { font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
tr.career td { font-weight: 700; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 32px; font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .profile { grid-template-columns: 1fr; } .profile h2 { font-size: 30px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Court<span>side</span></div>
    <nav role="tablist">
      <button role="tab" data-tab="scores" aria-selected="true">Scores</button>
      <button role="tab" data-tab="standings">Standings</button>
      <button role="tab" data-tab="leaders">Leaders</button>
      <button role="tab" data-tab="players">Players</button>
    </nav>
    <button class="install" id="install" hidden>Install app</button>
  </div>
  <div class="offline" id="offline" hidden>You're offline. Showing the last data saved on this device.</div>
</header>
<div class="ios-tip" id="iosTip" hidden>
  <p>To install Courtside on your iPhone, tap the <b>Share</b> button in Safari, then choose <b>Add to Home Screen</b>.</p>
  <button class="btn" id="iosTipClose">OK</button>
</div>
<main id="main"></main>
<footer>Data from ESPN's public NBA feeds, fetched live when you open each view.</footer>

<script>
const SITE = "https://site.api.espn.com/apis";
const WEB = "https://site.web.api.espn.com/apis/common/v3";
const main = document.getElementById("main");
const cache = new Map();

async function getJSON(url) {
  if (cache.has(url)) return cache.get(url);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`ESPN returned ${res.status} for this request.`);
  const data = await res.json();
  cache.set(url, data);
  return data;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const loading = msg => { main.innerHTML = `<p class="status">${esc(msg)}</p>`; };
const failed = e => `<p class="status err">Couldn't load data: ${esc(e.message)} Check your internet connection and try again.</p>`;
const ymd = d => d.toISOString().slice(0, 10).replace(/-/g, "");

/* ---------- Tabs ---------- */
const views = { scores: showScores, standings: showStandings, leaders: showLeaders, players: showPlayers };
function go(tab, arg) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  views[tab](arg);
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

/* ---------- Scores ---------- */
// NBA schedules run on US Eastern dates, so "today" follows New York (rolling over at 6am, after late games end), not the viewer's clock.
const nbaToday = () => { const [y, m, d] = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date(Date.now() - 6 * 3600000)).split("-"); return new Date(y, m - 1, d, 12); };
let scoreDate = nbaToday();
async function showScores() {
  const local = new Date(scoreDate.getTime() - scoreDate.getTimezoneOffset() * 60000);
  main.innerHTML = `
    <div class="toolbar">
      <h2>Scores</h2>
      <button class="btn" id="prev" aria-label="Previous day">&larr;</button>
      <input type="date" id="day" value="${local.toISOString().slice(0, 10)}">
      <button class="btn" id="next" aria-label="Next day">&rarr;</button>
      <button class="btn" id="today">Today</button>
    </div>
    <div id="games"><p class="status">Loading games…</p></div>`;
  const shift = n => { scoreDate = new Date(scoreDate.getTime() + n * 86400000); showScores(); };
  document.getElementById("prev").onclick = () => shift(-1);
  document.getElementById("next").onclick = () => shift(1);
  document.getElementById("today").onclick = () => { scoreDate = nbaToday(); showScores(); };
  document.getElementById("day").onchange = e => { const [y, m, d] = e.target.value.split("-"); scoreDate = new Date(y, m - 1, d, 12); showScores(); };

  const box = document.getElementById("games");
  try {
    const dayKey = local.toISOString().slice(0, 10).replace(/-/g, "");
    cache.delete(`${SITE}/site/v2/sports/basketball/nba/scoreboard?dates=${dayKey}`); // scores change, always refetch
    const data = await getJSON(`${SITE}/site/v2/sports/basketball/nba/scoreboard?dates=${dayKey}`);
    if (!data.events?.length) { box.innerHTML = `<p class="status">No NBA games on this day.</p>`; return; }
    box.innerHTML = `<div class="games">${data.events.map(gameCard).join("")}</div>`;
    box.querySelectorAll("[data-player]").forEach(b => b.onclick = () => go("players", b.dataset.player));
  } catch (e) { box.innerHTML = failed(e); }
}
function gameCard(ev) {
  const comp = ev.competitions[0];
  const st = ev.status.type;
  const teams = [...comp.competitors].sort((a, b) => (a.homeAway === "away" ? -1 : 1));
  const done = st.state === "post";
  const scores = teams.map(t => +t.score);
  const stateLabel = st.state === "in" ? `<span class="live">${esc(st.shortDetail)}</span>` : esc(st.state === "pre" ? new Date(ev.date).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : st.shortDetail);
  const lines = teams.map((t, i) => {
    const lost = done && scores[i] < scores[1 - i];
    return `<div class="team-line${lost ? " lost" : ""}">
      <img src="${esc(t.team.logo)}" alt="" loading="lazy">
      <div class="team-name">${esc(t.team.shortDisplayName)}<small>${esc(t.records?.[0]?.summary || "")}</small></div>
      <div class="score">${st.state === "pre" ? "" : esc(t.score)}</div>
    </div>`;
  }).join("");
  const leaders = teams.map(t => {
    const cat = t.leaders?.find(l => l.name === "points" || l.name === "pointsPerGame");
    const l = cat?.leaders?.[0];
    if (!l) return "";
    const unit = cat.name === "points" ? "PTS" : "PPG";
    return `<div>${esc(t.team.abbreviation)}: <button class="row-link" data-player="${esc(l.athlete.id)}">${esc(l.athlete.displayName)}</button> ${esc(l.displayValue)} ${unit}</div>`;
  }).join("");
  return `<article class="game">
    <div class="game-state"><span>${stateLabel}</span><span>${esc(comp.broadcasts?.[0]?.names?.[0] || "")}</span></div>
    ${lines}
    ${leaders ? `<div class="game-leaders">${leaders}</div>` : ""}
  </article>`;
}

/* ---------- Standings ---------- */
async function showStandings() {
  loading("Loading standings…");
  try {
    const data = await getJSON(`${SITE}/v2/sports/basketball/nba/standings`);
    const season = data.children[0].standings.seasonDisplayName;
    main.innerHTML = `
      <div class="toolbar"><h2>Standings</h2><span class="muted">${esc(season)} regular season</span></div>
      <div class="conf-grid">${data.children.map(confTable).join("")}</div>
      <p class="legend">Seeds 1–6 make the playoffs. Seeds 7–10 go to the play-in tournament (below the dashed line is out).</p>`;
  } catch (e) { main.innerHTML = failed(e); }
}
function confTable(conf) {
  const stat = (e, n) => e.stats.find(s => s.name === n || s.type === n.toLowerCase());
  const rows = [...conf.standings.entries].sort((a, b) => stat(a, "playoffSeed").value - stat(b, "playoffSeed").value);
  return `<section><h3>${esc(conf.name)}</h3><div class="table-wrap"><table>
    <thead><tr><th>#</th><th class="left">Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>Home</th><th>Road</th><th>L10</th><th>Strk</th><th>Diff</th></tr></thead>
    <tbody>${rows.map((e, i) => {
      const diff = stat(e, "differential")?.value ?? 0;
      const strk = stat(e, "streak")?.displayValue || "";
      return `<tr class="${i === 5 || i === 9 ? "cutoff" : ""}">
        <td class="rank">${i + 1}</td>
        <td><div class="who"><img class="logo" src="${esc(e.team.logos?.[0]?.href)}" alt="" loading="lazy"><span class="hl">${esc(e.team.shortDisplayName)}</span></div></td>
        <td>${esc(stat(e, "wins")?.displayValue)}</td><td>${esc(stat(e, "losses")?.displayValue)}</td>
        <td>${esc(stat(e, "winPercent")?.displayValue)}</td><td>${esc(stat(e, "gamesBehind")?.displayValue)}</td>
        <td>${esc(stat(e, "Home")?.displayValue)}</td><td>${esc(stat(e, "Road")?.displayValue)}</td>
        <td>${esc(stat(e, "Last Ten Games")?.displayValue)}</td>
        <td class="${strk.startsWith("W") ? "w" : "l"}">${esc(strk)}</td>
        <td class="${diff >= 0 ? "w" : "l"}">${diff > 0 ? "+" : ""}${diff.toFixed(1)}</td>
      </tr>`;
    }).join("")}</tbody></table></div></section>`;
}

/* ---------- Leaders ---------- */
const LEADER_CATS = [
  ["offensive.avgPoints", "Points"], ["general.avgRebounds", "Rebounds"], ["offensive.avgAssists", "Assists"],
  ["defensive.avgSteals", "Steals"], ["defensive.avgBlocks", "Blocks"], ["offensive.avgThreePointFieldGoalsMade", "3-pointers made"],
  ["offensive.fieldGoalPct", "Field goal %"], ["offensive.threePointFieldGoalPct", "3-point %"], ["offensive.freeThrowPct", "Free throw %"],
];
const LEADER_COLS = [
  ["general.gamesPlayed", "GP"], ["general.avgMinutes", "MIN"], ["offensive.avgPoints", "PTS"], ["general.avgRebounds", "REB"],
  ["offensive.avgAssists", "AST"], ["defensive.avgSteals", "STL"], ["defensive.avgBlocks", "BLK"], ["offensive.avgTurnovers", "TO"],
  ["offensive.fieldGoalPct", "FG%"], ["offensive.avgThreePointFieldGoalsMade", "3PM"], ["offensive.threePointFieldGoalPct", "3P%"], ["offensive.freeThrowPct", "FT%"],
];
let leaderSort = "offensive.avgPoints";
async function showLeaders() {
  main.innerHTML = `
    <div class="toolbar">
      <h2>League leaders</h2>
      <label for="cat" class="muted">Rank by</label>
      <select id="cat">${LEADER_CATS.map(([k, n]) => `<option value="${k}"${k === leaderSort ? " selected" : ""}>${n}</option>`).join("")}</select>
    </div>
    <div id="lt"><p class="status">Loading leaders…</p></div>
    <p class="legend">Qualified players only. Click a column header to re-rank, or a name to open the player.</p>`;
  document.getElementById("cat").onchange = e => { leaderSort = e.target.value; showLeaders(); };
  const box = document.getElementById("lt");
  try {
    const data = await getJSON(`${WEB}/sports/basketball/nba/statistics/byathlete?region=us&lang=en&contentorigin=espn&isqualified=true&page=1&limit=50&sort=${leaderSort}:desc`);
    const idx = {};
    data.categories.forEach((c, ci) => c.names.forEach((n, ni) => idx[`${c.name}.${n}`] = [ci, ni]));
    const val = (a, key) => {
      const [ci, ni] = idx[key] || [];
      const cat = a.categories.find(c => c.name === data.categories[ci]?.name);
      return cat?.totals?.[ni] ?? "";
    };
    box.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>#</th><th class="left">Player</th><th class="left">Team</th>
        ${LEADER_COLS.map(([k, n]) => `<th class="sortable${k === leaderSort ? " sorted" : ""}" data-k="${k}">${n}</th>`).join("")}</tr></thead>
      <tbody>${data.athletes.map((a, i) => `<tr>
        <td class="rank">${i + 1}</td>
        <td><div class="who"><img src="${esc(a.athlete.headshot?.href)}" alt="" loading="lazy"><button class="row-link" data-player="${esc(a.athlete.id)}">${esc(a.athlete.displayName)}</button></div></td>
        <td class="left muted">${esc(a.athlete.teamShortName)}</td>
        ${LEADER_COLS.map(([k]) => `<td class="${k === leaderSort ? "hl" : ""}">${esc(val(a, k))}</td>`).join("")}
      </tr>`).join("")}</tbody></table></div>`;
    box.querySelectorAll("th.sortable").forEach(th => th.onclick = () => { leaderSort = th.dataset.k; showLeaders(); });
    box.querySelectorAll("[data-player]").forEach(b => b.onclick = () => go("players", b.dataset.player));
  } catch (e) { box.innerHTML = failed(e); }
}

/* ---------- Players ---------- */
const QUICK = [["3975", "Stephen Curry"], ["1966", "LeBron James"], ["3112335", "Nikola Jokic"], ["4065648", "Jayson Tatum"], ["3945274", "Luka Doncic"], ["4278073", "Shai Gilgeous-Alexander"], ["5104157", "Victor Wembanyama"], ["3032977", "Giannis Antetokounmpo"]];
let currentPlayer = null;
function showPlayers(id) {
  if (id) currentPlayer = id;
  main.innerHTML = `
    <div class="toolbar">
      <h2>Players</h2>
      <div class="search-box">
        <input type="search" id="q" placeholder="Search any NBA player…" autocomplete="off" aria-label="Search players">
        <div class="suggest" id="sugg" hidden></div>
      </div>
    </div>
    <div id="pv"></div>`;
  wireSearch();
  if (currentPlayer) loadPlayer(currentPlayer);
  else document.getElementById("pv").innerHTML = `<h3>Popular players</h3><div class="chips">${QUICK.map(([i, n]) => `<button class="chip" data-player="${i}">${n}</button>`).join("")}</div>`;
  main.querySelectorAll(".chip").forEach(b => b.onclick = () => showPlayers(b.dataset.player));
}
function wireSearch() {
  const q = document.getElementById("q"), sugg = document.getElementById("sugg");
  let timer, items = [], active = -1;
  const render = () => {
    sugg.hidden = !items.length;
    sugg.innerHTML = items.map((p, i) => `<button class="${i === active ? "active" : ""}" data-player="${esc(p.id)}">
      <img src="${esc(p.headshot?.href)}" alt=""><span><b>${esc(p.displayName)}</b><br><span class="muted">${esc(p.teamRelationships?.[0]?.displayName || "Not on a team")}</span></span></button>`).join("");
    sugg.querySelectorAll("button").forEach(b => b.onmousedown = e => { e.preventDefault(); showPlayers(b.dataset.player); });
  };
  q.addEventListener("input", () => {
    clearTimeout(timer);
    const term = q.value.trim();
    if (term.length < 2) { items = []; render(); return; }
    timer = setTimeout(async () => {
      try {
        const data = await getJSON(`${WEB}/search?query=${encodeURIComponent(term)}&type=player&sport=basketball&league=nba&limit=8`);
        items = (data.items || []).filter(p => p.league === "nba");
        active = -1; render();
      } catch { items = []; render(); }
    }, 250);
  });
  q.addEventListener("keydown", e => {
    if (!items.length) return;
    if (e.key === "ArrowDown") { active = (active + 1) % items.length; render(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = (active - 1 + items.length) % items.length; render(); e.preventDefault(); }
    else if (e.key === "Enter") showPlayers(items[Math.max(active, 0)].id);
    else if (e.key === "Escape") { items = []; render(); }
  });
  q.addEventListener("blur", () => setTimeout(() => { sugg.hidden = true; }, 100));
}
async function loadPlayer(id) {
  const pv = document.getElementById("pv");
  pv.innerHTML = `<p class="status">Loading player…</p>`;
  try {
    const [bio, stats] = await Promise.all([
      getJSON(`${WEB}/sports/basketball/nba/athletes/${id}`),
      getJSON(`${WEB}/sports/basketball/nba/athletes/${id}/stats`).catch(() => null),
    ]);
    const a = bio.athlete;
    const avg = stats?.categories?.find(c => c.name === "averages");
    const seasons = avg ? [...avg.statistics].reverse() : [];
    const latest = seasons[0];
    const pick = (row, label) => row?.stats?.[avg.labels.indexOf(label)] ?? "–";
    const fact = (k, v) => v ? `<span>${k} <b>${esc(v)}</b></span>` : "";
    pv.innerHTML = `
      <section class="profile">
        <img src="${esc(a.headshot?.href)}" alt="${esc(a.displayName)}">
        <div>
          <h2>${a.jersey ? `<span class="jersey">#${esc(a.jersey)}</span>` : ""}${esc(a.displayName)}</h2>
          <div class="muted">${esc([a.position?.displayName, a.team?.displayName].filter(Boolean).join(" · "))}</div>
          <div class="facts">${fact("Age", a.age)}${fact("Height", a.displayHeight)}${fact("Weight", a.displayWeight)}${fact("Draft", a.displayDraft)}${fact("College", a.college?.name)}${fact("Experience", a.displayExperience)}</div>
        </div>
      </section>
      ${latest ? `
        <h3>${esc(latest.season.displayName)} per game</h3>
        <div class="tiles">${["PTS", "REB", "AST", "STL", "BLK", "FG%", "3P%", "MIN"].map(l => `<div class="tile"><div class="v">${esc(pick(latest, l))}</div><div class="k">${l}</div></div>`).join("")}</div>
        <h3>Season by season</h3>
        <div class="table-wrap"><table>
          <thead><tr><th class="left">Season</th><th class="left">Team</th>${avg.labels.map(l => `<th>${esc(l)}</th>`).join("")}</tr></thead>
          <tbody>
            ${seasons.map(s => `<tr><td class="hl">${esc(s.season.displayName)}</td><td class="left muted">${esc(stats.teams?.[s.teamSlug]?.abbreviation || "")}</td>${s.stats.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}
            ${avg.totals ? `<tr class="career"><td>Career</td><td></td>${avg.totals.map(v => `<td>${esc(v)}</td>`).join("")}</tr>` : ""}
          </tbody></table></div>` : `<p class="status">No NBA regular-season stats yet for this player.</p>`}`;
  } catch (e) { pv.innerHTML = failed(e); }
}

go("scores");

/* ---------- App install + offline ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
const offlineBar = document.getElementById("offline");
const syncOnline = () => { offlineBar.hidden = navigator.onLine; };
addEventListener("online", syncOnline);
addEventListener("offline", syncOnline);
syncOnline();

const installBtn = document.getElementById("install");
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let installPrompt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; installBtn.hidden = false; });
addEventListener("appinstalled", () => { installBtn.hidden = true; installPrompt = null; });
// iPhone/iPad Safari has no install prompt, so explain the manual steps instead.
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (isIOS && !standalone) installBtn.hidden = false;
installBtn.onclick = async () => {
  if (installPrompt) {
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installBtn.hidden = true;
  } else if (isIOS) {
    document.getElementById("iosTip").hidden = false;
  }
};
document.getElementById("iosTipClose").onclick = () => { document.getElementById("iosTip").hidden = true; };
</script>
